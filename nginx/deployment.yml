apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  namespace: mynginx

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: dhinu456/nginx-demo:d5b7a840
          ports:
            - containerPort: 80
